name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Tests
        run: pytest

      - name: Demo
        run: python examples/demo.py

  databases:
    name: End to end on MySQL 8 and PostgreSQL 16
    runs-on: ubuntu-latest
    env:
      # Throwaway password for the service containers of this run only.
      DB_PASSWORD: ci_${{ github.run_id }}_${{ github.run_attempt }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_${{ github.run_id }}_${{ github.run_attempt }}
          MYSQL_DATABASE: sync
          MYSQL_USER: sync
          MYSQL_PASSWORD: ci_${{ github.run_id }}_${{ github.run_attempt }}
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sync
          POSTGRES_USER: sync
          POSTGRES_PASSWORD: ci_${{ github.run_id }}_${{ github.run_attempt }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U sync"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with database extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mysql,postgres]"

      - name: Sync end to end (count, idempotency, checkpoint, reconciliation)
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: sync
          MYSQL_DATABASE: sync
        run: |
          export MYSQL_PASSWORD=$DB_PASSWORD
          export POSTGRES_DSN="host=127.0.0.1 port=5432 dbname=sync user=sync password=$DB_PASSWORD"
          set -o pipefail
          pytest tests/e2e -v -rs | tee e2e.txt
          # both databases must really have run, not been skipped
          ! grep -q "SKIPPED" e2e.txt

      - name: Container job against the fake server (writes to PostgreSQL)
        run: |
          python examples/fake_server.py --port 8080 --records 200 --page-cap 50 &
          sleep 2
          ODATA_URL=http://127.0.0.1:8080/odata/ ODATA_ENTITY=Invoices ODATA_KEY=Key \
          ODATA_CURSOR=ModifiedAt ODATA_SERVER_TZ=America/Sao_Paulo TARGET_TABLE=invoices_job \
          TARGET="postgresql://sync:$DB_PASSWORD@127.0.0.1:5432/sync" \
          odata-sync-job | tee job.json
          python -c "import json; d=json.load(open('job.json')); assert d['rows_in_target'] == 200, d"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t odata-incremental-sync:ci .
      - name: Image starts and reports missing configuration
        run: |
          set +e
          docker run --rm odata-incremental-sync:ci
          test $? -eq 1
