[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "odata-incremental-sync"
dynamic = ["version"]
description = "Incremental sync and key-only reconciliation for OData APIs: checkpoints, safe paging, retries with backoff and gap detection. Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Souza" }]
keywords = ["odata", "etl", "incremental", "sync", "reconciliation", "checkpoint", "mysql", "postgresql"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["requests>=2.28", "tzdata>=2024.1"]

[project.optional-dependencies]
mysql = ["PyMySQL>=1.1"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=7", "responses>=0.23", "ruff>=0.5"]

[project.scripts]
odata-sync-job = "odata_sync.job:main"

[project.urls]
Homepage = "https://github.com/gavicoding/odata-incremental-sync"
Issues = "https://github.com/gavicoding/odata-incremental-sync/issues"

[tool.setuptools.dynamic]
version = { attr = "odata_sync.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["examples", "tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["odata_sync", "fake_server"]
